name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: browser-actions/setup-chrome@v1
      - name: Julia engine
        run: julia test/runtests.jl
      - name: Dilute Metro 2 evaluator
        run: node metro2/test.mjs
      - name: Frontend contract, engine parity, and static smoke
        working-directory: frontend
        run: npm ci && npm test
      - name: Browser console
        run: node frontend/browser-check.mjs
